# Serveur
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/handihelper_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
